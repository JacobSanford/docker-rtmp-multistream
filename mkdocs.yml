site_name: docker-rtmp-multistream
site_description: Lightweight nginx-based RTMP relay/encoder for simultaneous streaming to multiple services
site_author: Jacob Sanford
site_url: https://jacobsanford.github.io/docker-rtmp-multistream/

repo_name: JacobSanford/docker-rtmp-multistream
repo_url: https://github.com/JacobSanford/docker-rtmp-multistream

extra:
  version:
    provider: mike
    default: latest

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret

nav:
  - Home: index.md
  - User Guide:
    - Requirements: requirements.md
    - QuickStart: quickstart.md
    - Configuration: configuration.md
    - Streaming Services:
      - Overview: services/overview.md
      - Twitch: services/twitch.md
      - YouTube: services/youtube.md
      - Archive: services/archive.md
    - Performance:
      - Hardware: performance/hardware.md
      - Bandwidth: performance/bandwidth.md
      - Quality: performance/quality.md
    - Technical Reference:
      - Architecture: techref/architecture.md
      - Service Patterns: techref/service-patterns.md
      - Environment Variables: techref/environment.md
    - Troubleshooting:
      - Overview: troubleshooting/index.md
      - IP Authentication: troubleshooting/ip_authentication.md
      - Connection Issues: troubleshooting/connection-issues.md
      - Services:
        - Twitch: troubleshooting/services/twitch.md
        - YouTube: troubleshooting/services/youtube.md
        - Archive: troubleshooting/services/archive.md
  - Developer Guide:
    - Adding Services:
      - Overview: developer/adding-services/overview.md
      - Configuration: developer/adding-services/configuration.md
      - Testing: developer/adding-services/testing.md
    - Security: security.md
    - Testing: developer/testing.md
  - Contributing Documentation: contributing.md

plugins:
  - search
  - htmlproofer:
      enabled: !ENV [CI, false]  # Only run in CI, not local builds
      raise_error: true  # Fail build on broken links
      raise_error_after_finish: true  # Check all links before failing
      validate_external_urls: true  # Check external links too
      validate_rendered_template: true
      ignore_urls:
        - 'https://help.twitch.tv/*'  # May rate-limit
        - 'https://studio.youtube.com'  # Requires auth
#  - to-pdf:
#      cover_title: docker-rtmp-multistream
#      cover_subtitle: Documentation and User Guide
#      cover_logo: https://raw.githubusercontent.com/JacobSanford/docker-rtmp-multistream/refs/heads/1.x/thumbnail.png
#      download_link: header
  - enumerate-headings:
      exclude:
        - index.md