site_name: docker-rtmp-multistream
site_description: Lightweight nginx-based RTMP relay/encoder for simultaneous streaming to multiple services
site_author: Jacob Sanford
site_url: https://jacobsanford.github.io/docker-rtmp-multistream/

repo_name: JacobSanford/docker-rtmp-multistream
repo_url: https://github.com/JacobSanford/docker-rtmp-multistream

extra:
  version:
    provider: mike
    default: latest

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting Started:
    - Requirements: requirements.md
    - Quick Start: quickstart.md
    - Configuration: configuration.md
  - User Guide:
    - Architecture: architecture.md
    - Quality & Performance: quality.md
    - Security: security.md
    - Services:
      - Twitch: services/twitch.md
      - YouTube: services/youtube.md
      - Archive: services/archive.md
    - Troubleshooting: troubleshooting.md
  - Developer Guide:
    - Adding Services: developer/adding-services.md
    - Environment Variables: developer/environment.md
    - Testing: developer/testing.md

plugins:
  - search
  - htmlproofer:
      enabled: !ENV [CI, false]  # Only run in CI, not local builds
      raise_error: true  # Fail build on broken links
      raise_error_after_finish: true  # Check all links before failing
      validate_external_urls: true  # Check external links too
      validate_rendered_template: true
      ignore_urls:
        - 'https://help.twitch.tv/*'  # May rate-limit
        - 'https://studio.youtube.com'  # Requires auth
